name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  RESOURCE_GROUP: apply
  STATIC_WEB_APP: applypilotcentral-web-khaah5ti4wzag
  FUNCTION_APP: applypilotcentral-api-khaah5ti4wzag
  STORAGE_ACCOUNT: applypilotcentralkhaah5t
  SQL_SERVER: simplyapply
  SQL_DATABASE: applypilot
  FRONTEND_URL: https://blue-water-0d76ed710.7.azurestaticapps.net
  BROWSER_WORKER: applypilotcentral-browser-khaah5
  BROWSER_REGISTRY: applypilotcentralbrowserkhaah5w2
  BROWSER_IDENTITY: applypilotcentral-browser-khaah5-id
  AZURE_CLIENT_ID: f7743fa2-90ca-4580-a292-012e5ccac741
  AZURE_TENANT_ID: 80fa3d36-87ac-489f-890a-6f0b55870bc5
  AZURE_SUBSCRIPTION_ID: b5f1fa5f-c39f-4d7d-866c-57836fe7382f

jobs:
  infrastructure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify browser worker resource providers
        run: |
          test "$(az provider show --namespace Microsoft.App --query registrationState --output tsv)" = "Registered"
          test "$(az provider show --namespace Microsoft.ContainerRegistry --query registrationState --output tsv)" = "Registered"

      - name: Deploy infrastructure
        run: |
          worker_image="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$BROWSER_WORKER" --query properties.template.containers[0].image --output tsv 2>/dev/null || true)"
          parameters=(infra/dev.bicepparam)
          if [[ -n "$worker_image" ]]; then
            parameters+=("browserWorkerImage=$worker_image")
          fi
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infra/main.bicep \
            --parameters "${parameters[@]}"

  backend:
    name: Deploy backend and worker
    needs: infrastructure
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install backend dependencies
        run: npm ci --prefix backend --omit=dev --workspaces=false

      - name: Allow this runner to migrate Azure SQL
        id: sql_firewall
        run: |
          runner_ip="$(curl --fail --silent --show-error https://api.ipify.org)"
          test -n "$runner_ip"
          rule_name="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az sql server firewall-rule create --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" --name "$rule_name" --start-ip-address "$runner_ip" --end-ip-address "$runner_ip"
          echo "rule_name=$rule_name" >> "$GITHUB_OUTPUT"

      - name: Apply pending database migrations
        env:
          AZURE_SQL_SERVER: simplyapply.database.windows.net
          AZURE_SQL_DATABASE: ${{ env.SQL_DATABASE }}
        run: npm run migrate --prefix backend

      - name: Grant browser worker database access
        env:
          AZURE_SQL_SERVER: simplyapply.database.windows.net
          AZURE_SQL_DATABASE: ${{ env.SQL_DATABASE }}
          WORKER_IDENTITY_NAME: ${{ env.BROWSER_WORKER }}
        run: |
          worker_client_id="$(az identity show --resource-group "$RESOURCE_GROUP" --name "$BROWSER_IDENTITY" --query clientId --output tsv)"
          test -n "$worker_client_id"
          WORKER_CLIENT_ID="$worker_client_id" npm run grant-worker --prefix backend

      - name: Remove temporary SQL firewall rule
        if: always() && steps.sql_firewall.outputs.rule_name != ''
        run: az sql server firewall-rule delete --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" --name "${{ steps.sql_firewall.outputs.rule_name }}"

      - name: Build backend deployment package
        working-directory: backend
        run: zip -q -r ../backend.zip host.json package.json package-lock.json src node_modules

      - name: Publish backend from private Blob Storage
        run: |
          storage_key="$(az storage account keys list --resource-group "$RESOURCE_GROUP" --account-name "$STORAGE_ACCOUNT" --query '[0].value' --output tsv)"
          test -n "$storage_key"
          az storage container create --account-name "$STORAGE_ACCOUNT" --account-key "$storage_key" --name function-releases
          blob_name="github/${GITHUB_SHA}/backend.zip"
          az storage blob upload --account-name "$STORAGE_ACCOUNT" --account-key "$storage_key" --container-name function-releases --name "$blob_name" --file backend.zip --overwrite true
          package_url="https://${STORAGE_ACCOUNT}.blob.core.windows.net/function-releases/${blob_name}"
          az functionapp config appsettings set --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_APP" --settings WEBSITE_RUN_FROM_PACKAGE="$package_url" WEBSITE_RUN_FROM_PACKAGE_BLOB_MI_RESOURCE_ID=SystemAssigned
          az functionapp restart --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_APP"
          function_resource="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Web/sites/${FUNCTION_APP}"
          az rest --method post --uri "https://management.azure.com${function_resource}/syncfunctiontriggers?api-version=2023-12-01"

      - name: Build and deploy Playwright browser worker
        run: |
          az acr build --registry "$BROWSER_REGISTRY" --image "applypilot-browser:${GITHUB_SHA}" worker
          worker_identity_id="$(az identity show --resource-group "$RESOURCE_GROUP" --name "$BROWSER_IDENTITY" --query id --output tsv)"
          test -n "$worker_identity_id"
          az containerapp registry set --resource-group "$RESOURCE_GROUP" --name "$BROWSER_WORKER" --server "${BROWSER_REGISTRY}.azurecr.io" --identity "$worker_identity_id"
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$BROWSER_WORKER" --image "${BROWSER_REGISTRY}.azurecr.io/applypilot-browser:${GITHUB_SHA}" --command npm start

      - name: Verify backend deployment
        run: |
          health_url="${FRONTEND_URL%/}/api/health"
          health=''
          for attempt in {1..12}; do
            health="$(curl --fail --silent --show-error "$health_url" || true)"
            if jq -e '.status == "ok" and .database.connected == true' <<<"$health" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          jq -e '.status == "ok" and .database.connected == true' <<<"$health" >/dev/null

  frontend:
    name: Deploy frontend
    needs: infrastructure
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://blue-water-0d76ed710.7.azurestaticapps.net
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci --prefix frontend --workspaces=false
          npm run build --prefix frontend

      - name: Read Static Web Apps deployment token
        id: swa
        run: |
          token="$(az staticwebapp secrets list --name "$STATIC_WEB_APP" --resource-group "$RESOURCE_GROUP" --query properties.apiKey --output tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend package
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

      - name: Verify frontend deployment
        run: |
          base_url="${FRONTEND_URL%/}"
          curl --fail --silent --show-error "$base_url/" >/dev/null
          curl --fail --silent --show-error "$base_url/login" >/dev/null
          curl --fail --silent --show-error "$base_url/logged-out" >/dev/null
          aad_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base_url/.auth/login/aad?post_login_redirect_uri=/dashboard")"
          case "$aad_status" in
            301|302|303|307|308) ;;
            *) echo "Microsoft login route returned HTTP $aad_status" >&2; exit 1 ;;
          esac
