name: Deploy non-production

on:
  # Called from CI after checks pass on non-main pushes.
  # Do not also use workflow_run on CI — that double-starts deploy and
  # concurrency cancel-in-progress cancels the in-flight run.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: non-production
  cancel-in-progress: true

env:
  AZURE_CORE_OUTPUT: none
  RESOURCE_GROUP: apply-nonprod
  SQL_RESOURCE_GROUP: apply
  SQL_SERVER: simplyapply
  SQL_DATABASE: applypilot_nonprod
  AUTH_KEY_VAULT: applypilotcentralvaultkh
  AUTH_SECRET_NAME: azure-client-secret
  AZURE_CLIENT_ID: f7743fa2-90ca-4580-a292-012e5ccac741
  AZURE_TENANT_ID: 80fa3d36-87ac-489f-890a-6f0b55870bc5
  AZURE_SUBSCRIPTION_ID: b5f1fa5f-c39f-4d7d-866c-57836fe7382f

jobs:
  infrastructure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (github.event_name == 'push' && github.ref_name != 'main')
    runs-on: ubuntu-latest
    environment: non-production
    outputs:
      frontendName: ${{ steps.deploy.outputs.frontendName }}
      frontendUrl: ${{ steps.deploy.outputs.frontendUrl }}
      backendName: ${{ steps.deploy.outputs.backendName }}
      backendIdentityName: ${{ steps.deploy.outputs.backendIdentityName }}
      backendIdentityClientId: ${{ steps.deploy.outputs.backendIdentityClientId }}
      sqlDatabase: ${{ steps.deploy.outputs.sqlDatabase }}
      browserWorkerName: ${{ steps.deploy.outputs.browserWorkerName }}
      browserRegistryName: ${{ steps.deploy.outputs.browserRegistryName }}
      storageAccount: ${{ steps.deploy.outputs.storageAccount }}
      workerIdentity: ${{ steps.deploy.outputs.workerIdentity }}
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: deploy
        shell: bash
        run: |
          auth_secret="$(az keyvault secret show --vault-name "$AUTH_KEY_VAULT" --name "$AUTH_SECRET_NAME" --query value --output tsv)"
          test -n "$auth_secret"
          worker_image="$(az containerapp list --resource-group "$RESOURCE_GROUP" --query "[?tags.application=='ApplyPilot' && tags.environment=='nonproduction'] | [0].properties.template.containers[0].image" --output tsv)"
          backend_name="$(az functionapp list --resource-group "$RESOURCE_GROUP" --query "[?tags.application=='ApplyPilot' && tags.environment=='nonproduction'] | [0].name" --output tsv)"
          backend_package=''
          if [[ -n "$backend_name" ]]; then
            backend_package="$(az functionapp config appsettings list --resource-group "$RESOURCE_GROUP" --name "$backend_name" --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'] | [0].value" --output tsv)"
          fi
          deployment="nonprod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          parameters=(infra/nonprod.bicepparam "azureClientSecretValue=$auth_secret")
          if [[ -n "$worker_image" ]]; then
            parameters+=("browserWorkerImage=$worker_image")
          fi
          if [[ -n "$backend_package" ]]; then
            parameters+=("backendPackageUrl=$backend_package")
          fi
          az deployment group create --resource-group "$RESOURCE_GROUP" --name "$deployment" --template-file infra/main.bicep --parameters "${parameters[@]}"
          for output in frontendName frontendUrl backendName backendIdentityName backendIdentityClientId sqlDatabase browserWorkerName browserRegistryName; do
            value="$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "$deployment" --query "properties.outputs.${output}.value" --output tsv)"
            test -n "$value"
            echo "${output}=${value}" >> "$GITHUB_OUTPUT"
          done
          storage="$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "$deployment" --query properties.outputs.backendStorageAccount.value --output tsv)"
          identity="$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "$deployment" --query properties.outputs.browserWorkerIdentityName.value --output tsv)"
          test -n "$storage"
          test -n "$identity"
          echo "storageAccount=${storage}" >> "$GITHUB_OUTPUT"
          echo "workerIdentity=${identity}" >> "$GITHUB_OUTPUT"

  backend:
    name: Deploy backend and worker
    needs: infrastructure
    runs-on: ubuntu-latest
    environment: non-production
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install backend dependencies
        run: npm ci --prefix backend --omit=dev --workspaces=false

      - name: Allow this runner to migrate Azure SQL
        id: sql_firewall
        run: |
          runner_ip="$(curl --fail --silent --show-error https://api.ipify.org)"
          test -n "$runner_ip"
          rule_name="github-nonprod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az sql server firewall-rule create -g "$SQL_RESOURCE_GROUP" -s "$SQL_SERVER" -n "$rule_name" --start-ip-address "$runner_ip" --end-ip-address "$runner_ip"
          echo "rule_name=$rule_name" >> "$GITHUB_OUTPUT"

      - name: Apply pending non-production migrations
        env:
          AZURE_SQL_SERVER: simplyapply.database.windows.net
          AZURE_SQL_DATABASE: ${{ env.SQL_DATABASE }}
        run: npm run migrate --prefix backend

      - name: Grant non-production worker database access
        env:
          AZURE_SQL_SERVER: simplyapply.database.windows.net
          AZURE_SQL_DATABASE: ${{ env.SQL_DATABASE }}
          WORKER_IDENTITY_NAME: ${{ needs.infrastructure.outputs.browserWorkerName }}
        run: |
          worker_client_id="$(az identity show -g "$RESOURCE_GROUP" -n "${{ needs.infrastructure.outputs.workerIdentity }}" --query clientId -o tsv)"
          test -n "$worker_client_id"
          WORKER_CLIENT_ID="$worker_client_id" npm run grant-worker --prefix backend

      - name: Grant non-production backend database access
        env:
          AZURE_SQL_SERVER: simplyapply.database.windows.net
          AZURE_SQL_DATABASE: ${{ env.SQL_DATABASE }}
          DATABASE_IDENTITY_MODE: backend
          DATABASE_IDENTITY_NAME: ${{ needs.infrastructure.outputs.backendIdentityName }}
          DATABASE_IDENTITY_CLIENT_ID: ${{ needs.infrastructure.outputs.backendIdentityClientId }}
        run: |
          test -n "$DATABASE_IDENTITY_CLIENT_ID"
          npm run grant-database-identity --prefix backend

      - name: Remove temporary SQL firewall rule
        if: always() && steps.sql_firewall.outputs.rule_name != ''
        run: az sql server firewall-rule delete -g "$SQL_RESOURCE_GROUP" -s "$SQL_SERVER" -n "${{ steps.sql_firewall.outputs.rule_name }}"

      - name: Build backend package
        working-directory: backend
        run: zip -q -r ../backend.zip host.json package.json package-lock.json src node_modules

      - name: Deploy backend package
        run: |
          storage_key="$(az storage account keys list -g "$RESOURCE_GROUP" -n "${{ needs.infrastructure.outputs.storageAccount }}" --query '[0].value' -o tsv)"
          test -n "$storage_key"
          az storage container create --account-name "${{ needs.infrastructure.outputs.storageAccount }}" --account-key "$storage_key" -n function-releases
          blob_name="github/${GITHUB_SHA}/backend.zip"
          az storage blob upload --account-name "${{ needs.infrastructure.outputs.storageAccount }}" --account-key "$storage_key" -c function-releases -n "$blob_name" -f backend.zip --overwrite true
          package_url="https://${{ needs.infrastructure.outputs.storageAccount }}.blob.core.windows.net/function-releases/${blob_name}"
          package_mi_id="$(az identity show -g "$RESOURCE_GROUP" -n "${{ needs.infrastructure.outputs.backendIdentityName }}" --query id -o tsv)"
          test -n "$package_mi_id"
          az functionapp config appsettings set -g "$RESOURCE_GROUP" -n "${{ needs.infrastructure.outputs.backendName }}" --settings WEBSITE_RUN_FROM_PACKAGE="$package_url" WEBSITE_RUN_FROM_PACKAGE_BLOB_MI_RESOURCE_ID="$package_mi_id"
          az functionapp restart -g "$RESOURCE_GROUP" -n "${{ needs.infrastructure.outputs.backendName }}"
          function_resource="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Web/sites/${{ needs.infrastructure.outputs.backendName }}"
          az rest --method post --uri "https://management.azure.com${function_resource}/syncfunctiontriggers?api-version=2023-12-01"

      - name: Build and deploy browser worker
        run: |
          registry="${{ needs.infrastructure.outputs.browserRegistryName }}"
          worker="${{ needs.infrastructure.outputs.browserWorkerName }}"
          az acr build --registry "$registry" --image "applypilot-browser:${GITHUB_SHA}" worker
          identity_id="$(az identity show -g "$RESOURCE_GROUP" -n "${{ needs.infrastructure.outputs.workerIdentity }}" --query id -o tsv)"
          az containerapp registry set -g "$RESOURCE_GROUP" -n "$worker" --server "${registry}.azurecr.io" --identity "$identity_id"
          az containerapp update -g "$RESOURCE_GROUP" -n "$worker" --image "${registry}.azurecr.io/applypilot-browser:${GITHUB_SHA}" --command npm start

      - name: Verify backend deployment
        run: |
          health_url="${{ needs.infrastructure.outputs.frontendUrl }}/api/health"
          health=''
          for attempt in {1..12}; do
            health="$(curl --fail --silent --show-error "$health_url" || true)"
            if jq -e '.status == "ok" and .database.connected == true' <<<"$health" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          jq -e '.status == "ok" and .database.connected == true' <<<"$health" >/dev/null

  frontend:
    name: Deploy frontend
    needs: infrastructure
    runs-on: ubuntu-latest
    environment: non-production
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci --prefix frontend --workspaces=false
          npm run build --prefix frontend

      - name: Read Static Web App deployment token
        id: swa
        run: |
          token="$(az staticwebapp secrets list -g "$RESOURCE_GROUP" -n "${{ needs.infrastructure.outputs.frontendName }}" --query properties.apiKey -o tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend package
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

      - name: Verify frontend deployment
        run: |
          base_url="${{ needs.infrastructure.outputs.frontendUrl }}"
          base_url="${base_url%/}"
          curl --fail --silent --show-error "$base_url/" >/dev/null
          curl --fail --silent --show-error "$base_url/login" >/dev/null
          curl --fail --silent --show-error "$base_url/logged-out" >/dev/null
          aad_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base_url/.auth/login/aad?post_login_redirect_uri=/dashboard")"
          case "$aad_status" in
            301|302|303|307|308) ;;
            *) echo "Microsoft login route returned HTTP $aad_status" >&2; exit 1 ;;
          esac
