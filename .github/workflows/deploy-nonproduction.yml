name: Deploy non-production

on:
  workflow_call:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: non-production
  cancel-in-progress: true

env:
  AZURE_CORE_OUTPUT: none
  RESOURCE_GROUP: apply
  SQL_SERVER: simplyapply
  SQL_DATABASE: applypilot_nonprod
  AUTH_KEY_VAULT: applypilotcentralvaultkh
  AUTH_SECRET_NAME: azure-client-secret
  AZURE_CLIENT_ID: f7743fa2-90ca-4580-a292-012e5ccac741
  AZURE_TENANT_ID: 80fa3d36-87ac-489f-890a-6f0b55870bc5
  AZURE_SUBSCRIPTION_ID: b5f1fa5f-c39f-4d7d-866c-57836fe7382f

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (github.event_name == 'push' && github.ref_name != 'main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch != 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: non-production
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy isolated non-production infrastructure
        id: infra
        shell: bash
        run: |
          auth_secret="$(az keyvault secret show --vault-name "$AUTH_KEY_VAULT" --name "$AUTH_SECRET_NAME" --query value --output tsv)"
          test -n "$auth_secret"
          deployment="nonprod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az deployment group create --resource-group "$RESOURCE_GROUP" --name "$deployment" --template-file infra/main.bicep --parameters infra/nonprod.bicepparam azureClientSecretValue="$auth_secret"
          for output in frontendName frontendUrl backendName backendIdentityName backendIdentityClientId sqlDatabase browserWorkerName browserRegistryName; do
            value="$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "$deployment" --query "properties.outputs.${output}.value" --output tsv)"
            test -n "$value"
            echo "${output}=${value}" >> "$GITHUB_OUTPUT"
          done
          storage="$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "$deployment" --query properties.outputs.backendStorageAccount.value --output tsv)"
          identity="$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "$deployment" --query properties.outputs.browserWorkerIdentityName.value --output tsv)"
          echo "storageAccount=${storage}" >> "$GITHUB_OUTPUT"
          echo "workerIdentity=${identity}" >> "$GITHUB_OUTPUT"

      - name: Install backend dependencies
        run: npm ci --prefix backend --omit=dev --workspaces=false

      - name: Allow this runner to migrate Azure SQL
        id: sql_firewall
        run: |
          runner_ip="$(curl --fail --silent --show-error https://api.ipify.org)"
          test -n "$runner_ip"
          rule_name="github-nonprod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az sql server firewall-rule create -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -n "$rule_name" --start-ip-address "$runner_ip" --end-ip-address "$runner_ip"
          echo "rule_name=$rule_name" >> "$GITHUB_OUTPUT"

      - name: Apply pending non-production migrations
        env:
          AZURE_SQL_SERVER: simplyapply.database.windows.net
          AZURE_SQL_DATABASE: ${{ env.SQL_DATABASE }}
        run: npm run migrate --prefix backend

      - name: Grant non-production worker database access
        env:
          AZURE_SQL_SERVER: simplyapply.database.windows.net
          AZURE_SQL_DATABASE: ${{ env.SQL_DATABASE }}
          WORKER_IDENTITY_NAME: ${{ steps.infra.outputs.browserWorkerName }}
        run: |
          worker_client_id="$(az identity show -g "$RESOURCE_GROUP" -n "${{ steps.infra.outputs.workerIdentity }}" --query clientId -o tsv)"
          test -n "$worker_client_id"
          WORKER_CLIENT_ID="$worker_client_id" npm run grant-worker --prefix backend

      - name: Grant non-production backend database access
        env:
          AZURE_SQL_SERVER: simplyapply.database.windows.net
          AZURE_SQL_DATABASE: ${{ env.SQL_DATABASE }}
          DATABASE_IDENTITY_MODE: backend
          DATABASE_IDENTITY_NAME: ${{ steps.infra.outputs.backendIdentityName }}
          DATABASE_IDENTITY_CLIENT_ID: ${{ steps.infra.outputs.backendIdentityClientId }}
        run: |
          test -n "$DATABASE_IDENTITY_CLIENT_ID"
          npm run grant-database-identity --prefix backend

      - name: Remove temporary SQL firewall rule
        if: always() && steps.sql_firewall.outputs.rule_name != ''
        run: az sql server firewall-rule delete -g "$RESOURCE_GROUP" -s "$SQL_SERVER" -n "${{ steps.sql_firewall.outputs.rule_name }}"

      - name: Build and publish backend
        working-directory: backend
        run: zip -q -r ../backend.zip host.json package.json package-lock.json src node_modules

      - name: Activate backend package
        run: |
          storage_key="$(az storage account keys list -g "$RESOURCE_GROUP" -n "${{ steps.infra.outputs.storageAccount }}" --query '[0].value' -o tsv)"
          test -n "$storage_key"
          az storage container create --account-name "${{ steps.infra.outputs.storageAccount }}" --account-key "$storage_key" -n function-releases
          blob_name="github/${GITHUB_SHA}/backend.zip"
          az storage blob upload --account-name "${{ steps.infra.outputs.storageAccount }}" --account-key "$storage_key" -c function-releases -n "$blob_name" -f backend.zip --overwrite true
          package_url="https://${{ steps.infra.outputs.storageAccount }}.blob.core.windows.net/function-releases/${blob_name}"
          az functionapp config appsettings set -g "$RESOURCE_GROUP" -n "${{ steps.infra.outputs.backendName }}" --settings WEBSITE_RUN_FROM_PACKAGE="$package_url" WEBSITE_RUN_FROM_PACKAGE_BLOB_MI_RESOURCE_ID=SystemAssigned
          az functionapp restart -g "$RESOURCE_GROUP" -n "${{ steps.infra.outputs.backendName }}"
          function_resource="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Web/sites/${{ steps.infra.outputs.backendName }}"
          az rest --method post --uri "https://management.azure.com${function_resource}/syncfunctiontriggers?api-version=2023-12-01"

      - name: Build and deploy browser worker
        run: |
          registry="${{ steps.infra.outputs.browserRegistryName }}"
          worker="${{ steps.infra.outputs.browserWorkerName }}"
          az acr build --registry "$registry" --image "applypilot-browser:${GITHUB_SHA}" worker
          identity_id="$(az identity show -g "$RESOURCE_GROUP" -n "${{ steps.infra.outputs.workerIdentity }}" --query id -o tsv)"
          az containerapp registry set -g "$RESOURCE_GROUP" -n "$worker" --server "${registry}.azurecr.io" --identity "$identity_id"
          az containerapp update -g "$RESOURCE_GROUP" -n "$worker" --image "${registry}.azurecr.io/applypilot-browser:${GITHUB_SHA}" --command npm start

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci --prefix frontend --workspaces=false
          npm run build --prefix frontend

      - name: Deploy frontend
        id: swa
        run: |
          token="$(az staticwebapp secrets list -g "$RESOURCE_GROUP" -n "${{ steps.infra.outputs.frontendName }}" --query properties.apiKey -o tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

      - name: Verify non-production
        run: bash scripts/verify-deployment.sh "${{ steps.infra.outputs.frontendUrl }}" non-production
